[package]
name = "neolog-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8"
lz4_flex = "0.11"
memchr = "2"
memmap2 = "0.9"
zstd = "0.13"
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
